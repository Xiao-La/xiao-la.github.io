<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.3.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
</head>

<body id="page">
  <!--style中定义视图的长宽尺寸-->
  <div id="main" style="width: 2000px;height:1200px;"></div>
  <script type="text/javascript">

    let blackStyle = [
      "#343233",  // 背景和省份颜色
      "#2be4f3",  // 省份边界线颜色
      "#5aae5c",  // 点亮省份的颜色
      "#fff",     // 标签字体的颜色
      "#ffff00"   // 城市圆点的颜色
    ];
    let grayStyle = [
      "#dedfde",
      "#6e6e6d",
      "#d5e5f1",
      "#000",
      "#fe7e3a",
  ]
    // 自由选择样式
    let style = grayStyle;

    document.getElementById("page").style.background = style[0];
    var myChart = echarts.init(document.getElementById('main'));
    myChart.showLoading();
  $.get('./100000_full.json', function (geoJson) {
      myChart.hideLoading();
      echarts.registerMap('china', geoJson);
      myChart.setOption(
        option = {
          title: {
            text: '旅行足迹'
          },
          geo: {
            name: '旅行足迹',
            type: 'map',
            map: 'china',
            selectedMode: 'multiple',
            zoom: 1,
            roam: true,
            // 不允许再缩小：缩得比现在还小，挨得近的城市点会挤到一起，
            // 标签就又会互相压盖了（放大没有这个问题，所以只限制下限）
            scaleLimit: { min: 1, max: 20 },
            animation: false,
            itemStyle: {
              normal: {
                borderWidth: 1,             // 省份边界线宽度
                borderColor: style[1],     // 省份边界线颜色
                areaColor: style[0]        // 省份颜色
              },
            },
            // 点亮的省份
            regions: [
              { name: ["北京市"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["湖南省"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["青海省"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["广东省"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["甘肃省"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["福建省"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["浙江省"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["重庆市"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["上海市"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["贵州省"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["江西省"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["香港特别行政区"], itemStyle: { normal: { areaColor: style[2] }, }, },
              { name: ["云南省"], itemStyle: { normal: { areaColor: style[2] }, }, },
            ],
          },
          series: {
            name: '标记点',
            type: 'scatter',
            animation: false,   // 缩放时标签高频重排，不做过渡动画
            coordinateSystem: 'geo',
            // 去过的城市，对应的经纬度
            // 标签默认贴在圆点正下方；珠三角、福建沿海、江西这些城市挨得很近，
            // 用 label.offset 把标签错开（[左右, 上下]，单位是像素）。
            // 这是 1 倍缩放下的起始布局，缩放后由文件底部"标签防重叠的实时布局"
            // 代码重新求解，放得越大标签会贴得离自己的圆点越近。
            data: [

            { name: '北京', value: [116.4074, 39.9042] },

            { name: '上海', value: [121.4737, 31.2304] },

            { name: '重庆', value: [106.5049, 29.5332] },

            { name: '福州', value: [119.3062, 26.0751], label: { offset: [10, 6] } },

            { name: '宁德', value: [119.5420, 26.6657], label: { offset: [18, 2] } },

            { name: '南平', value: [118.1784, 26.6415], label: { offset: [-6, 2] } },

            { name: '泉州', value: [118.5894, 24.9078], label: { offset: [22, 2] } },

            { name: '厦门', value: [118.0894, 24.4798], label: { offset: [-2, 18] } },

            { name: '漳州', value: [117.6478, 24.5130] },

            { name: '兰州', value: [103.8343, 36.0611] },

            { name: '张掖', value: [100.4498, 38.9259] },

            { name: '广州', value: [113.2644, 23.1291], label: { offset: [-22, 2] } },

            { name: '深圳', value: [114.0579, 22.5431], label: { offset: [-2, 22] } },

            { name: '东莞', value: [113.7518, 23.0207], label: { offset: [-2, -30] } },

            { name: '贵阳', value: [106.6302, 26.6470] },

            { name: '长沙', value: [112.9388, 28.2282] },

            { name: '西宁', value: [101.7778, 36.6171] },

            { name: '杭州', value: [120.1552, 30.2741] },

            { name: '温州', value: [120.6994, 27.9991], label: { offset: [2, 2] } },

            { name: '南昌', value: [115.8581, 28.6832], label: { offset: [-2, 6] } },

            { name: '九江', value: [115.9850, 29.7000], label: { offset: [-22, 2] } },

            { name: '景德镇', value: [117.2272, 29.2901], label: { offset: [6, 2] } },

            { name: '香港', value: [114.1733, 22.3193], label: { offset: [-2, 2] } },

            { name: '惠州', value: [114.4055, 23.0791], label: { offset: [22, 2] } },

            { name: '丽江', value: [100.2330, 26.8721] },

            { name: '香格里拉', value: [99.7065, 27.8253], label: { offset: [-26, 2] } }

            ],
            symbolSize: 5,
            label: {
              formatter: '{b}',
              show: true,
              position: 'bottom',
              color: style[3], // 标签字体的颜色
              fontSize: 12,
              fontWeight: 'bold',
              fontFamily: 'sans-serif'
            },
            itemStyle: {
              color: style[4], // 圆点的颜色
              borderWidth: 2, // 边框大小
              borderColor: style[4], // 圆点边框的样式
            }
          },
        }
      )
      layoutLabels();   // 数据到位后做第一次布局校准
    })

    myChart.on('click', function (params) {
      // 在用户点击后控制台打印数据的名称
      console.log(params);
    });

    // —— 标签防重叠的实时布局 ——
    // 标签默认贴在圆点正下方；城市挤在一起时用 label.offset 把标签错开。
    // offset 是像素值，缩放后点与点之间的距离会变：放大后距离拉开，之前
    // 的错开量就不再需要了，标签要贴回自己的点。所以每次缩放都重新求解：
    // 在不与任何文字/圆点重叠的前提下，优先保留当前位置（避免跳动），
    // 冲突时选离圆点最近的空位；没冲突时也会尝试把标签往圆点收。
    var labelCtx = document.createElement('canvas').getContext('2d');
    labelCtx.font = 'bold 12px sans-serif';    // 与 label 的 fontSize/fontWeight/fontFamily 一致

    var DOT_R = 3.2;          // 圆点半径（含边框）
    var LABEL_H = 12.5;       // 12px 加粗汉字的墨水高度（含少量余量）
    var LABEL_DY = 8.5;       // offset 为 [0,0] 时文字顶部距圆点中心的像素距离
    var GAP_MIN = 2;          // 文字/圆点之间要求的最小间隙(px)
    var VIEW_W = 2000, VIEW_H = 1200;   // 与 #main 的尺寸一致

    // 候选错开位置，按"离圆点近"排序；优先保持在圆点下方（dy >= 0）
    var OFFSETS = [];
    (function () {
      for (var dx = -36; dx <= 36; dx += 2) {
        for (var dy = -32; dy <= 28; dy += 2) {
          OFFSETS.push([dx, dy, Math.abs(dx) + Math.abs(dy) * 1.5 + (dy < 0 ? 10 : 0)]);
        }
      }
      OFFSETS.sort(function (a, b) { return a[2] - b[2]; });
    })();

    var cityList = null;   // 首次 layoutLabels 时从已设置的 option 里构建

    function labelBox(c, off) {
      return { x: c.px[0] + off[0] - c.w / 2, y: c.px[1] + LABEL_DY + off[1], w: c.w, h: LABEL_H };
    }
    function dotBox(c) {
      return { x: c.px[0] - DOT_R, y: c.px[1] - DOT_R, w: DOT_R * 2, h: DOT_R * 2 };
    }
    function gapBetween(a, b) {
      var ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
      var oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
      if (ox > 0 && oy > 0) return -Math.min(ox, oy);   // 有重叠，返回负值
      if (ox > 0) return Math.abs(oy);
      if (oy > 0) return Math.abs(ox);
      return Math.sqrt(ox * ox + oy * oy);
    }
    function costOf(off) {
      return Math.abs(off[0]) + Math.abs(off[1]) * 1.5 + (off[1] < 0 ? 10 : 0);
    }
    function countCollisions(c, off) {
      var box = labelBox(c, off);
      var n = 0;
      for (var i = 0; i < cityList.length; i++) {
        var o = cityList[i];
        if (o === c) {
          if (gapBetween(box, dotBox(o)) < GAP_MIN) n++;      // 自己的圆点
        } else {
          if (gapBetween(box, labelBox(o, o.off)) < GAP_MIN) n++;
          if (gapBetween(box, dotBox(o)) < GAP_MIN) n++;
        }
      }
      if (box.x < 2 || box.x + box.w > VIEW_W - 2 || box.y < 2 || box.y + box.h > VIEW_H - 2) n += 10;
      return n;
    }
    function layoutLabels() {
      if (!cityList) {
        cityList = myChart.getOption().series[0].data.map(function (d) {
          return {
            name: d.name,
            value: d.value.slice(),
            off: (d.label && d.label.offset) ? d.label.offset.slice() : [0, 0],
            w: labelCtx.measureText(d.name).width
          };
        });
      }
      var i, c;
      for (i = 0; i < cityList.length; i++) {
        cityList[i].px = myChart.convertToPixel({ geoIndex: 0 }, cityList[i].value);
      }
      var round = 0, changed = true;
      while (changed && round < 20) {          // 贪心多扫几轮直到稳定
        changed = false; round++;
        for (i = 0; i < cityList.length; i++) {
          c = cityList[i];
          var best = c.off, bestCost = costOf(c.off);
          var collide = countCollisions(c, c.off) > 0;
          for (var j = 0; j < OFFSETS.length; j++) {
            if (countCollisions(c, OFFSETS[j]) > 0) continue;
            // 第一个（即最靠圆的）不冲突的位置：要么解决冲突，要么比现在更贴近圆点
            if (collide || OFFSETS[j][2] < bestCost) { best = OFFSETS[j]; bestCost = OFFSETS[j][2]; }
            break;
          }
          if (best !== c.off) { c.off = [best[0], best[1]]; changed = true; }
        }
      }
      myChart.setOption({
        animation: false,    // 缩放时高频更新，不做过渡动画
        series: [{
          data: cityList.map(function (c) {
            return { name: c.name, value: c.value.slice(), label: { offset: c.off.slice() } };
          })
        }]
      });
    }

    var lastZoom = null;
    var layoutTimer = null;
    myChart.on('georoam', function () {
      var zoom = myChart.getOption().geo[0].zoom;
      if (lastZoom !== null && Math.abs(zoom - lastZoom) < 1e-9) return;  // 纯平移，相对位置没变
      lastZoom = zoom;
      // 双指/滚轮缩放是一连串事件，等动作停下 120ms 再求解，
      // 确保拿到的是缩放稳定后的坐标（连续缩放中途坐标还在变）
      if (layoutTimer) clearTimeout(layoutTimer);
      layoutTimer = setTimeout(function () {
        layoutTimer = null;
        layoutLabels();
      }, 120);
    });

  </script>
</body>

</html>
