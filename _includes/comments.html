{% if site.comments.enabled %}
  <section class="comments-panel" aria-labelledby="comments-title">
    <header class="comments-header">
      <div>
        <h2 class="comments-title" id="comments-title">评论</h2>
      </div>
      <p class="visitor-count" aria-label="正在读取页面访问次数">
        <span class="visitor-icon" aria-hidden="true"></span>
        <span>阅读</span>
        <strong class="waline-pageview-count" data-path="{{ page.url | url_decode | escape }}" aria-live="polite">加载中</strong>
        <span class="visitor-count-suffix">次</span>
      </p>
    </header>

    <div id="waline"></div>
    <p class="comments-status" id="comments-status" role="status" hidden>评论服务暂时无法加载，请稍后再试。</p>
    <noscript><p class="comments-status">启用 JavaScript 后即可查看和发表评论。</p></noscript>
  </section>

  <!-- Keep browser dependencies on the same origin as the GitHub Pages site. -->
  <link rel="stylesheet" href="{{ '/assets/vendor/waline/3.16.1/waline.css' | relative_url }}">
  <script>
    (function () {
      var status = document.getElementById('comments-status');
      var visitor = document.querySelector('.visitor-count');
      var visitorValue = visitor.querySelector('.waline-pageview-count');
      var visitorSuffix = visitor.querySelector('.visitor-count-suffix');

      function markVisitorUnavailable() {
        if (/^\d+$/.test(visitorValue.textContent.trim())) return;

        visitorValue.textContent = '暂不可用';
        visitorSuffix.hidden = true;
        visitor.classList.add('is-unavailable');
        visitor.setAttribute('aria-label', '页面访问次数暂时不可用');
      }

      function showCommentsUnavailable() {
        status.hidden = false;
        markVisitorUnavailable();
      }

      function start() {
      if (!window.Waline) {
        showCommentsUnavailable();
        return;
      }

      try {
        // Key comments and counters by the decoded page.url, matching the migrated Valine data.
        Waline.init({
          el: '#waline',
          serverURL: {{ site.comments.waline.server_url | jsonify }},
          path: {{ page.url | url_decode | jsonify }},
          lang: 'zh-CN',
          locale: { placeholder: '写下你的评论…' },
          pageview: true,
          comment: false,
          emoji: false,
          search: false,
          imageUploader: false
        });

        window.setTimeout(function () {
          if (/^\d+$/.test(visitorValue.textContent.trim())) {
            visitor.setAttribute('aria-label', '页面访问次数 ' + visitorValue.textContent.trim());
          } else {
            markVisitorUnavailable();
          }
        }, 10000);
      } catch (error) {
        showCommentsUnavailable();
        console.error('Waline failed to initialize:', error);
      }
      }

      // The comments sit below the article: fetch Waline once the page has
      // loaded and the browser is idle, so it never holds up the article.
      // It still loads on every visit, so page views keep being counted.
      function load() {
        var script = document.createElement('script');
        script.src = {{ '/assets/vendor/waline/3.16.1/waline.umd.js' | relative_url | jsonify }};
        script.onload = start;
        script.onerror = showCommentsUnavailable;
        document.head.appendChild(script);
      }
      function whenIdle() {
        if (window.requestIdleCallback) requestIdleCallback(load, { timeout: 2000 });
        else setTimeout(load, 0);
      }
      if (document.readyState === 'complete') whenIdle();
      else window.addEventListener('load', whenIdle, { once: true });
    }());
  </script>
{% endif %}
