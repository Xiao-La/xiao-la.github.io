# Site metadata
title: Joy's Blog
description: Joy 的个人博客，记录生活、学习与技术笔记。
author: Joy
email: marcustonytxi@gmail.com
lang: zh-CN
timezone: Asia/Shanghai
url: https://joyslog.top
baseurl: ""
repository: Xiao-La/xiao-la.github.io

# Kept for compatibility with image links in existing articles.
assets_base_url: https://joyslog.top

# Content and URLs
markdown: kramdown
kramdown:
  input: GFM
permalink: /:year/:month/:day/:title/
future: true

# Homepage pagination
paginate: 15
paginate_path: /page:num/

# GitHub Pages-supported plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

collections:
  study:
    output: true
    permalink: /study/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: study
    values:
      layout: study

# External services are configured here instead of inside templates.
comments:
  enabled: true
  valine:
    app_id: YHAa8KVAgllvIvixOSZFNLjZ-MdYXbMMI
    app_key: ZGi29AAOtj9dSsltGGpBDYb8
    server_url: https://valine.joyslog.top

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
